<!DOCTYPE html>
<html lang='en'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='robots' content='noindex,nofollow'>
<title>Cash Back 1% - MTD Achievement</title>
<style>
:root{--navy:#1F3864;--lb:#D9E1F2;--bg:#f4f6fa;--card:#fff;--mut:#5b6573}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Roboto,Noto Sans Khmer,Khmer OS,Arial,sans-serif;background:var(--bg);color:#1c2430;font-size:14px;line-height:1.4}
[hidden]{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lf{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12);width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#lf h2{color:var(--navy)}
input,select,button{font:inherit}
input,select{padding:9px 10px;border:1px solid #c5ccd8;border-radius:6px;background:#fff;width:100%}
button{cursor:pointer;border:0;border-radius:6px;padding:9px 14px;background:var(--navy);color:#fff}
#err{color:#c62828;font-size:13px;min-height:16px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px}
header small{opacity:.8}
.who{display:flex;gap:10px;align-items:center;font-size:13px}
.who button{background:rgba(255,255,255,.18);padding:6px 10px}
nav{display:flex;gap:4px;padding:10px 16px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{background:#e3e8f1;color:var(--navy);border-radius:8px 8px 0 0;padding:10px 18px;font-weight:600}
.tab.on{background:var(--navy);color:#fff}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #dde3ee}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
main{padding:14px 16px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi span{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi b{font-size:24px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto}
.card h3{font-size:14px;color:var(--navy);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;text-align:right;padding:8px;white-space:nowrap;user-select:none}
#lt th{cursor:pointer}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;border-bottom:1px solid #eef1f6;text-align:right}
tr.tot td{font-weight:700;background:var(--lb)}
.a0{background:#ffc7ce}
.a1{background:#ffeb9c}
.a2{background:#e2efda}
.a3{background:#c6efce}
.seg{padding:2px 8px;border-radius:10px;font-size:12px;display:inline-block}
.bars{display:flex;flex-direction:column;gap:12px}
.br{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-size:12px}
.bt{height:12px;background:#4472c4;border-radius:3px}
.bm{height:12px;background:#ed7d31;border-radius:3px;margin-top:3px}
.lg{display:flex;gap:14px;font-size:12px;margin-bottom:8px}
.lg i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar input{max-width:300px}
.note{font-size:12px;color:var(--mut);padding:8px 16px 20px;text-align:center}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
header h1{font-size:15px}
.kpi b{font-size:20px}
.tab{flex:1;padding:10px 6px}
table.rt thead{display:none}
table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
table.rt tr{background:#fff;border:1px solid #dde3ee;border-radius:10px;margin-bottom:10px;padding:6px 10px}
table.rt td{display:flex;justify-content:space-between;gap:12px;text-align:right!important;border:0;padding:4px 0}
table.rt td:before{content:attr(data-l);color:var(--mut);text-align:left;flex-shrink:0}
}
</style></head><body>
<div id='login'><form id='lf'><h2>Cash Back 1% Dashboard</h2><p>Sign in with your User ID and PIN</p><input id='u' placeholder='User ID' autocomplete='username'><input id='p' type='password' placeholder='PIN' autocomplete='current-password'><button id='lbtn' type='submit' disabled>Sign in</button><div id='lmsg' style='font-size:13px;color:#5b6573'>Loading data…</div><div id='err'></div></form></div>
<div id='app' hidden>
<header><div><h1>Cash Back 1% – Month-to-Date Achievement</h1><small id='sub'></small></div><div class='who'><span id='who'></span><button id='out' type='button'>Sign out</button></div></header>
<nav><button class='tab on' data-t='dash' type='button'>Dashboard</button><button class='tab' data-t='list' type='button'>Store List</button></nav>
<section class='filters'><label>Month<select id='fm'></select></label><label>DT<select id='fd'></select></label><label>Zone (Code – Name)<select id='fz'></select></label><label>Store (Code – Name)<select id='fs'></select></label><label id='ftl' hidden>Shop type<select id='ft'></select></label></section>
<main id='dash'>
<div class='kpis' id='kpis'></div>
<div class='grid'><div class='card'><h3>Achievement by shop type</h3><div id='tt'></div></div><div class='card'><h3>Target vs MTD purchase by shop type</h3><div id='bars'></div></div></div>
<div class='grid'><div class='card'><h3>Achievement by DT</h3><div id='tdt'></div></div><div class='card'><h3>Achievement by zone</h3><div id='tz'></div></div></div>
</main>
<main id='list' hidden>
<div class='bar'><input id='q' placeholder='Search store code or name'><b id='cnt'></b></div>
<div class='card'><div id='lt'></div></div>
</main>
<div class='note' id='foot'></div>
</div>
<script>
var D={months:[],th:[0.8,0.5],asof:'',gen:'',users:[]},S=[],LOADED=false;
var $=function(i){return document.getElementById(i)};
var Q=String.fromCharCode(34),U=null,mi=0,sortK='prio',sortD=1,TH=[0.8,0.5];
function nf(n){return Math.round(n).toLocaleString('en-US')}
function nf2(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function pc(x){return (x*100).toFixed(1)+'%'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hs(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function mname(k){var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[k%100-1]+' '+Math.floor(k/100)}
function ds(s){return s?new Date((s-25569)*864e5).toISOString().slice(0,10):'-'}
function seg(t,m){if(t<=0)return 'No target';var a=m/t;if(a>=1)return 'Achieved';if(a>=TH[0])return 'Close';if(a>=TH[1])return 'Mid';return m>0?'Low':'Not started'}
var SC={'Achieved':'#C6EFCE','Close':'#E2EFDA','Mid':'#FFEB9C','Low':'#F8CBAD','Not started':'#FFC7CE','No target':'#eeeeee'};
function ac(a){return a>=1?'a3':a>=TH[0]?'a2':a>=TH[1]?'a1':'a0'}

function fillMonths(keep){var fm=$('fm'),k=keep||D.months[D.months.length-1];fm.innerHTML='';for(var i=D.months.length-1;i>=0;i--)opt(fm,i,mname(D.months[i]));var ix=D.months.indexOf(k);fm.value=ix>=0?ix:D.months.length-1}
function setSub(){$('sub').textContent='Data through '+D.asof+' | Last updated '+D.gen}
function load(){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
var keep=U?D.months[mi]:null;D=j;S=j.stores;TH=j.th;LOADED=true;$('lbtn').disabled=false;$('lmsg').textContent='';
if(U){fillMonths(keep);setSub();refresh()}}).catch(function(){if(!LOADED)$('lmsg').textContent='Cannot load data. Please refresh the page.'})}
load();setInterval(load,300000);document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
$('lf').onsubmit=function(e){e.preventDefault();var id=$('u').value.trim().toLowerCase(),pn=hs($('p').value.trim().toLowerCase());for(var i=0;i<D.users.length;i++){var u=D.users[i];if(u[0].toLowerCase()===id&&u[5]===pn){U=u;start();return}}$('err').textContent='Invalid User ID or PIN'};
$('out').onclick=function(){location.reload()};
function scope(){return S.filter(function(s){return U[2]==='Grand Total'||(U[2]==='DT'&&s[3]===U[3])||(U[2]==='Zone'&&s[4]===U[4])})}
function opt(s,v,t){var o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o)}
function fill(id,vals,all){var s=$(id),c=s.value;s.innerHTML='';opt(s,'All',all);vals.forEach(function(v){opt(s,v[0],v[1])});s.value=vals.some(function(v){return v[0]===c})?c:'All'}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i}).sort()}
function start(){$('login').hidden=true;$('app').hidden=false;
$('who').textContent=U[1]+' | '+U[2]+(U[2]==='DT'?' ('+U[3]+')':U[2]==='Zone'?' ('+U[4]+')':'');
fillMonths();
var ft=$('ft');opt(ft,'All','All shop types');['BAWS','WS','Large','Unclassified'].forEach(function(t){opt(ft,t,t)});
setSub();
$('foot').textContent='Targets are the monthly targets from the Cash Back sheet applied to the selected month. MTD cashback = MTD purchase x each store cashback rate (Cash Back column S), earned only when the store reaches 100% of its target. Purchases are from the Admin Report (selling price after promotion). This page refreshes automatically every 5 minutes.';
refresh()}
function R(x){var m=x[7][mi]||0,t=x[5]||0;return {c:x[0],n:x[1],ty:x[2],dt:x[3],z:x[4],t:t,m:m,a:t>0?m/t:0,g:Math.max(t-m,0),sg:seg(t,m),l:x[6],r:x[8]||0,cb:(t>0&&m>=t)?m*(x[8]||0):0}}
function sum(r){var o={n:r.length,t:0,m:0,g:0,k:0,cb:0};r.forEach(function(x){o.t+=x.t;o.m+=x.m;o.g+=x.g;o.cb+=x.cb;if(x.t>0&&x.a>=1)o.k++});o.a=o.t>0?o.m/o.t:0;return o}
function grp(rows,key,order){var m={};rows.forEach(function(x){(m[x[key]]=m[x[key]]||[]).push(x)});var ks=order||Object.keys(m).sort();return ks.filter(function(k){return m[k]}).map(function(k){return [k,sum(m[k])]})}
function tr(n,o,c){return '<tr'+(c?' class='+c:'')+'><td>'+esc(n)+'</td><td>'+nf(o.t)+'</td><td>'+nf(o.m)+'</td><td>'+o.n+'</td><td class='+ac(o.a)+'>'+pc(o.a)+'</td><td>'+nf(o.g)+'</td><td>'+o.k+'</td><td>'+nf2(o.cb)+'</td></tr>'}
function gt(first,list,tot){var h='<table><thead><tr><th>'+first+'</th><th>Monthly Target</th><th>MTD Purchase</th><th>Outlets</th><th>Achievement %</th><th>Shortfall to 100%</th><th>Outlets at 100%+</th><th>MTD Cashback</th></tr></thead><tbody>';list.forEach(function(p){h+=tr(p[0],p[1],'')});return h+tr('Total',tot,'tot')+'</tbody></table>'}
function refresh(){mi=+$('fm').value;
var sc=scope();
fill('fd',uniq(sc.map(function(x){return x[3]})).map(function(v){return [v,v]}),'All DTs');
var d=$('fd').value,s1=sc.filter(function(x){return d==='All'||x[3]===d});
fill('fz',uniq(s1.map(function(x){return x[4]})).map(function(v){return [v,v]}),'All zones');
var z=$('fz').value,s2=s1.filter(function(x){return z==='All'||x[4]===z});
fill('fs',s2.slice().sort(function(a,b){return a[0]<b[0]?-1:1}).map(function(x){return [x[0],x[0]+' - '+x[1]]}),'All stores');
var st=$('fs').value,rows=s2.filter(function(x){return st==='All'||x[0]===st}).map(R);
var rs=sc.map(R),r1=s1.map(R);
var t=sum(rows);
$('kpis').innerHTML=[['Outlets',nf(t.n)],['Monthly target',nf(t.t)],['MTD purchase',nf(t.m)],['Achievement',pc(t.a)],['Shortfall to 100%',nf(t.g)],['Outlets at 100%+',t.k],['MTD cashback',nf2(t.cb)]].map(function(k){return '<div class=kpi><span>'+k[0]+'</span><b>'+k[1]+'</b></div>'}).join('');
var gs=grp(rows,'ty',['BAWS','WS','Large','Unclassified']);
$('tt').innerHTML=gt('Shop Type',gs,t);
var mx=1;gs.forEach(function(p){mx=Math.max(mx,p[1].t,p[1].m)});
$('bars').innerHTML='<div class=lg><span><i style='+Q+'background:#4472c4'+Q+'></i>Monthly target</span><span><i style='+Q+'background:#ed7d31'+Q+'></i>MTD purchase</span></div><div class=bars>'+gs.map(function(p){return '<div class=br><span>'+esc(p[0])+'</span><div><div class=bt style='+Q+'width:'+(p[1].t/mx*100)+'%'+Q+'></div><div class=bm style='+Q+'width:'+(p[1].m/mx*100)+'%'+Q+'></div></div></div>'}).join('')+'</div>';
$('tdt').innerHTML=gt('DT',grp(rows,'dt'),t);
$('tz').innerHTML=gt('Zone (Code - Name)',grp(rows,'z'),t);
renderList(rows)}
var COLS=[['c','Store Code'],['n','Store Name'],['ty','Shop Type'],['dt','DT'],['z','Zone (Code - Name)'],['t','Cashback Target'],['m','MTD Purchase'],['a','Achievement %'],['g','Shortfall to 100%'],['sg','Segment'],['l','Last Order Date'],['r','Cashback Rate'],['cb','MTD Cashback']];
var LAST=[];
function pr(x){return x.t<=0?2:x.g>0?0:1}
function renderList(rows){LAST=rows;var q=$('q').value.trim().toLowerCase(),ty=$('ft').value;
var r=rows.filter(function(x){return (ty==='All'||x.ty===ty)&&(!q||(x.c+' '+x.n).toLowerCase().indexOf(q)>=0)});
r.sort(function(a,b){if(sortK==='prio'){return pr(a)-pr(b)||a.g-b.g||(a.c<b.c?-1:1)}var A=a[sortK],B=b[sortK];return (A<B?-1:A>B?1:0)*sortD});
$('cnt').textContent=r.length+' stores listed';
var h='<table id=tbl class=rt><thead><tr>'+COLS.map(function(c){return '<th data-k='+c[0]+'>'+c[1]+(sortK===c[0]?(sortD>0?' &#9650;':' &#9660;'):'')+'</th>'}).join('')+'</tr></thead><tbody>';
r.forEach(function(x){var v=[esc(x.c),esc(x.n),esc(x.ty),esc(x.dt),esc(x.z),nf(x.t),nf(x.m),pc(x.a),nf(x.g),'<span class=seg style='+Q+'background:'+SC[x.sg]+Q+'>'+x.sg+'</span>',ds(x.l),pc(x.r),nf2(x.cb)];
h+='<tr>'+v.map(function(c,i){return '<td data-l='+Q+COLS[i][1]+Q+(i===7?' class='+ac(x.a):'')+'>'+c+'</td>'}).join('')+'</tr>'});
$('lt').innerHTML=h+'</tbody></table>'}
$('lt').onclick=function(e){var k=e.target.getAttribute('data-k');if(!k)return;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1}renderList(LAST)};
$('q').oninput=function(){renderList(LAST)};
['fm','fd','fz','fs'].forEach(function(i){$(i).onchange=refresh});
$('ft').onchange=function(){renderList(LAST)};
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');var t=b.getAttribute('data-t');$('dash').hidden=t!=='dash';$('list').hidden=t!=='list';$('ftl').hidden=t!=='list'}});
</script></body></html>
