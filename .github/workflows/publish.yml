name: publish-data
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: publish-data
jobs:
  publish:
    if: startsWith(github.event.issue.title, 'DONE ') && github.event.issue.user.login == 'morea-cashback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble data.json from DATA issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          _, batch, n = os.environ['TITLE'].split()
          n = int(n)
          out = subprocess.check_output(['gh', 'issue', 'list', '--repo', os.environ['REPO'], '--state', 'open', '--author', 'morea-cashback', '--limit', '200', '--json', 'number,title,body'])
          parts, nums = {}, []
          for i in json.loads(out):
              m = re.fullmatch(r'DATA ' + batch + r' (\d+)/' + str(n), i['title'])
              b = re.match(r'\s*\[\[\[(.*)\]\]\]\s*$', i['body'] or '', re.S)
              if m and b:
                  parts[int(m.group(1))] = b.group(1)
                  nums.append(i['number'])
          assert sorted(parts) == list(range(1, n + 1)), 'missing parts'
          text = ''.join(parts[k] for k in range(1, n + 1))
          d = json.loads(text)
          assert 'stores' in d and len(d['stores']) > 0, 'no stores'
          open('data.json', 'w', encoding='utf-8').write(text)
          open('/tmp/nums.txt', 'w').write(' '.join(str(x) for x in nums))
          print('stores', len(d['stores']), 'parts', n)
          PY
      - name: Commit and push
        run: |
          git config user.name "morea-bot"
          git config user.email "morea-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Dashboard data update" && git push)
      - name: Close issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for x in $(cat /tmp/nums.txt) ${{ github.event.issue.number }}; do gh issue close "$x" --repo "${{ github.repository }}"; done
